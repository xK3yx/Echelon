name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: echelon
          POSTGRES_PASSWORD: echelon
          POSTGRES_DB: echelon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echelon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://echelon:echelon@localhost:5432/echelon
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # libmagic for upload sniffing; Pango for WeasyPrint so the PDF test runs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 libpango-1.0-0 libpangoft2-1.0-0
      # The backend is not packaged (the Dockerfiles install dependencies
      # directly), so install the dependency lists from pyproject.toml.
      - name: Install dependencies
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb'))['project']; print('\n'.join(d['dependencies'] + d['optional-dependencies']['dev']))" > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
      - run: ruff check app
      - run: black --check app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
